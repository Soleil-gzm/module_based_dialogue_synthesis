# ============================================
# M0 业务线 - 基础配置（6 个任务共用）
# 任务 YAML 通过 `base: ../base_M0.yaml` 引用
# ============================================

company: "suning"
start_module:
  身份确认: 0.99
  语音留言: 0.01
output_dir: "output/yamls"
paths_cache_dir: "paths"
paths_cache: "output/yamls/paths/all_paths_{num_paths}_{seed}.json"
checkpoint_interval: 50000

# ============================================
# 话术抽样策略（特定条件优先）
# ============================================
# 当候选集中同时存在"通用层"（0~1 个条件项）和"特定层"（≥2 个条件项）时：
#   以该概率从特定层抽，以 (1-p) 从通用层抽
#   0.0 = 完全等概率（旧行为）
#   0.7 = 推荐，特定条件明显优先但通用仍保留多样性
#   1.0 = 只要有特定行就必从特定行抽
specific_condition_priority: 0.7

# 特定层内部按条件项数加权：权重 = 1 + alpha * (项数 - 2)
#   0.0 = 特定层内部等概率
#   0.5 = 推荐，越具体越优先
condition_complexity_alpha: 0.5

# ---- A/B 集 ----
a_set:
  - "通用原因"
  - "否认办理业务"
  - "工程款"
  - "未发工资"
  - "还错卡"
  - "生病住院"
  - "破产"
  - "失业"
  - "他人用款"
  - "忘记还款"
  - "盗刷"

b_set:
  - "敷衍"
  - "投诉处理"
  - "信息问题"
  - "不方便接电"
  - "对抗"
  - "没钱"
  - "诉求"
  - "承诺还款"
  - "无法沟通"

terminal_modules:
  - "已还款"

self_loop_modules:
  # 语音留言: 0.01

insert_nodes:
  - "失业"
  - "破产"
  - "生病住院"
  - "未发工资"
  - "工程款"
  - "通用原因"
  - "没钱"

# ---- 施压 ----
pressure_prob: 0.3
pressure_dynamic_enabled: true
pressure_calc_type: "exponential"
pressure_start_prob: 0.5
pressure_end_prob: 1.0
pressure_curve_exponent: 3.5
pressure_max_total: 3
pressure_strategy:
  type: "normalized"
module_pressure_weights:
  没钱: 1.2
  失业: 1.0
  破产: 1.0
  生病住院: 1.0
  未发工资: 1.0
  工程款: 1.0
  通用原因: 0.9

# ---- 再见/继承链 ----
flexible_stop_prob: 0.7
goodbye_termination_prob: 0.8
goodbye_dynamic_enabled: false
goodbye_calc_type: "exponential"
goodbye_start_prob: 0.05
goodbye_end_prob: 0.8
goodbye_exponent: 3.0
goodbye_min_idx: 2

# ---- 解析器/日志/去重/分析/多进程 ----
time_generator:
  type: "simple_natural"

trace_enabled: true
logging:
  level: "DEBUG"
  file_prefix: "dialogue_builder"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

dedup:
  enabled: true
  threshold: 0.85
  ignore_numbers: true
  output_suffix: "_dup"

analysis:
  enabled: true
  format: "html"
  diversity_modules:
    - "告知"
    - "已还款"
    - "信息问题"
    - "无法沟通"
    - "诉求"
    - "未发工资"
  coverage_enabled: true

multiprocessing:
  num_processes: 10