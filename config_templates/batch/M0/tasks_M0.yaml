  - name: "M0_WN_AN"
    enabled: true
    task_name: "M0_WN_AN"
    num_paths: 4000
    random_seed: 21
    excel_path: "datas/backbone_data_suning_agent/M0/【M0】无意愿无能力-首催 - 20260922.xlsx"
