    prob_auto_generate:
      enabled: true
      categories_yaml: "config_templates/prob_config/categories_M0-0917.yaml"   # ← 补这一行
      compress_mode: "log"
    case_loader:
      type: "xiaoying"
      replace_dir: "output/M0/M0_WN_AN/case/replaceM0_WN_AN_4w"
      system_dir: "output/M0/M0_WN_AN/case/systemM0_WN_AN_4w"
