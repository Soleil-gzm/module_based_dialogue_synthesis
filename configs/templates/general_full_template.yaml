# ============================================
# 多轮对话生成系统 - 完整配置模板
# 版本：v4.0 (支持所有配置化功能)
# 说明：所有配置均在此文件中定义，修改后无需更改代码。
#       配置项按功能模块分组，每个配置项均有详细注释说明。
#       带 # 默认值 的配置项可以省略，使用默认值。
# ============================================


# ============================================
# 1. 项目基础配置
# ============================================
company: "example"                  # 公司/业务标识（仅用于日志和命名）
start_module: "身份确认"             # 对话起始模块名（必须存在于 modules 列表中）
task_name: "general"                # 任务名称（输出子目录为 {task_name}_{num_dialogues}_{seed}）
output_dir: "output"                # 根输出目录（所有任务输出到该目录下）
paths_cache_dir: "paths"            # 路径缓存的子目录（相对于 output_dir）
# paths_cache: "output/paths/all_paths_{num_paths}_{seed}.json"  # 默认值：路径缓存文件模板（保持原有命名以兼容缓存复用）


# ============================================
# 2. 生成规模与随机性
# ============================================
num_dialogues: 40000                # 要生成的对话数量（新命名，推荐使用）
# num_paths: 40000                   # 旧命名，与 num_dialogues 等效，num_dialogues 优先级更高
num_paths_to_generate: 10000        # 实际生成的不重复路径数（小于 num_dialogues 时循环复用路径）
random_seed: 42                     # 全局随机种子（用于可复现性）
checkpoint_interval: 5000           # 断点续传保存间隔（每生成 N 条对话保存一次）


# ============================================
# 3. 数据文件路径
# ============================================
excel_path: "datas/example/话术模板.xlsx"   # 话术模板 Excel 文件（包含所有模块 sheet 和链接施压话术 sheet）
prob_path: "datas/example/prob.xlsx"        # 模块转移概率矩阵 Excel 文件

# 案例加载器配置（支持多种类型）
case_loader:
  type: "default"                   # 加载器类型：default（单目录） 或 xiaoying（双目录）
  # default 模式所需参数（当 type="default" 时启用）
  cases_dir: "datas/cases"          # 案例文件目录（每个 .txt 同时作为 prompt 和占位数据）
  # xiaoying 模式所需参数（当 type="xiaoying" 时启用）
  # replace_dir: "datas/xiaoying/cases_replace"   # 占位数据目录
  # system_dir: "datas/xiaoying/cases_system"     # 系统提示目录


# ============================================
# 4. 模块定义与业务规则
# ============================================
# modules:                          # 模块列表（可选：从 Excel 模板自动提取，如需手动指定取消注释）
#   - "身份确认"
#   - "告知"
#   ...

# max_repeat:                       # 每个模块的最大重复次数（可选：从 Excel 模板自动提取，如需手动覆盖取消注释）
#   身份确认: 4
#   告知: 1
#   ...

# A/B 集规则（用于路径生成中的候选集限制）
# A_set：问题原因类模块，路径中只能出现一个 A_set 模块
# B_set：态度回应类模块，可以在路径中多次出现
a_set:
  - "通用原因"
  - "否认办理业务"
  - "工程款"
  - "未发工资"
  - "还错卡"
  - "生病住院"
  - "破产"
  - "失业"
  - "他人用款"
  - "忘记还款"
  - "盗刷"

b_set:
  - "敷衍"
  - "投诉处理"
  - "信息问题"
  - "不方便接电"
  - "对抗"
  - "没钱"
  - "诉求"
  - "承诺还款"
  - "无法沟通"

# 终止模块（路径遇到这些模块时停止继续扩展）
terminal_modules:
  - "承诺还款"
  - "已还款"

# 独立循环模块配置（这些模块的路径独立于正常路径，只在自身循环）
# 格式：模块名: 该模块路径在所有路径中的占比概率
self_loop_modules:
  语音留言: 0.01

# 需要附加施压话术的模块（当这些模块出现在路径中时，可能触发施压）
insert_nodes:
  - "失业"
  - "破产"
  - "生病住院"
  - "未发工资"
  - "工程款"
  - "通用原因"
  - "没钱"


# ============================================
# 5. 跳转规则配置（核心配置：替代代码中的硬编码规则）
# ============================================
# transition_rules: 定义模块之间的跳转规则，支持白名单和黑名单两种模式
#
# 配置说明：
#   每个模块可以配置以下属性：
#   模块名:
#     mode: 规则模式
#       - "allow_list": 白名单模式，只允许跳转到 modules 列表中的模块
#       - "deny_list": 黑名单模式，禁止跳转到 modules 列表中的模块（默认）
#     modules: 规则对应的模块列表（根据 mode 不同含义不同）
#        - "模块A"
#        - "模块B"
#     force_stop_on_max_repeat: 是否在达到 max_repeat 次数时强制终止路径（默认 false）
#
#   规则优先级：
#     1. 如果当前模块在 transition_rules 中有配置，按配置规则筛选候选模块
#     2. 如果当前模块在 a_set 中，候选为 [current] + b_set（A集规则）
#     3. 如果当前模块在 b_set 中，候选为 b_set + [selected_a]（B集规则）
#     4. 默认候选为所有模块
#
#   额外规则（自动应用，无需配置）：
#     - A_set 模块不能跳转到其他 A_set 模块（只能有一个 A_set 模块）
#     - 已被 ban 的模块（达到 max_repeat 次数）不会出现在候选中
#     - 终止模块（terminal_modules）如果在概率表中有非零概率，会被加入候选
#
transition_rules:
  # 身份确认：只能跳转到 告知、三方、身份确认（白名单模式），达到最大次数时强制终止
  身份确认:
    mode: "allow_list"              # 白名单模式：只允许跳转到指定模块
    modules:
      - "告知"
      - "三方"
      - "身份确认"
    force_stop_on_max_repeat: true  # 达到 max_repeat 次数时强制停止路径

  # 告知：不能跳转到 身份确认、转告（黑名单模式）
  告知:
    mode: "deny_list"               # 黑名单模式：禁止跳转到指定模块
    modules:
      - "身份确认"
      - "转告"

  # 信息核实：不能跳转到 告知、身份确认、三方、转告（黑名单模式）
  信息核实:
    mode: "deny_list"
    modules:
      - "告知"
      - "身份确认"
      - "三方"
      - "转告"

  # 三方：只能跳转到 三方、转告（白名单模式）
  三方:
    mode: "allow_list"
    modules:
      - "三方"
      - "转告"


# ============================================
# 6. 施压话术配置
# ============================================
# 固定施压概率（仅在 pressure_dynamic_enabled=false 时使用）
pressure_prob: 0.3

# 动态施压概率开关
pressure_dynamic_enabled: true

# ---- 动态概率曲线参数（使用 probability.py 中的计算器） ----
pressure_calc_type: "exponential"   # 曲线类型：exponential（指数）| sigmoid | linear

# 指数曲线参数（pressure_calc_type=exponential 时使用）
pressure_start_prob: 0.02           # 路径开头基础概率（范围：0~1）
pressure_end_prob: 0.6              # 路径末尾基础概率（范围：0~1）
pressure_curve_exponent: 2.5        # 指数（越大后期增长越快，建议：1~5）

# Sigmoid 曲线参数（pressure_calc_type=sigmoid 时使用）
# pressure_sigmoid_slope: 10.0      # 斜率（越大曲线越陡峭，建议：5~30）

# 线性曲线参数（pressure_calc_type=linear 时使用）
# 会复用 pressure_start_prob 和 pressure_end_prob

# ---- 施压次数与位置策略 ----
pressure_max_total: 3               # 每条对话最多施压次数

# 施压位置策略：控制概率计算时的归一化位置 t
pressure_strategy:
  type: "normalized"                # normalized | absolute | sigmoid | linear_decay
  # absolute 策略需要 max_expected_modules
  # max_expected_modules: 15        # 期望最大模块数（absolute 模式下使用）
  # sigmoid 策略需要 slope
  # slope: 10.0                     # Sigmoid 斜率（sigmoid 模式下使用）

# ---- 模块权重（乘数） ----
# 仅对 insert_nodes 中的模块生效，权重 > 1 增加施压概率，< 1 降低施压概率
module_pressure_weights:
  没钱: 1.2
  失业: 1.0
  破产: 1.0
  生病住院: 1.0
  未发工资: 1.0
  工程款: 1.0
  通用原因: 0.9


# ============================================
# 7. 再见终止与继承链配置
# ============================================
# ---- 继承链停止概率 ----
flexible_stop_prob: 0.3            # 后代链遇到 flexible_stop=1 时提前停止的概率（范围：0~1）

# ---- 再见终止（固定概率，若动态再见未启用则使用此值） ----
goodbye_termination_prob: 0.7

# ---- 动态再见概率配置（与施压类似，独立控制） ----
goodbye_dynamic_enabled: true       # 是否启用动态再见概率
goodbye_calc_type: "exponential"    # 曲线类型：exponential | sigmoid | linear
goodbye_start_prob: 0.05            # 路径开头再见概率（范围：0~1）
goodbye_end_prob: 0.8               # 路径末尾再见概率（范围：0~1）
goodbye_exponent: 3.0               # 指数（越大后期增长越快，建议：1~5）
# Sigmoid 斜率（如使用 sigmoid）: goodbye_sigmoid_slope: 10.0
goodbye_min_idx: 2                  # 强制忽略前 N 个模块的再见（索引从0开始）


# ============================================
# 8. 解析器配置
# ============================================
condition_parser: "keyword"         # 条件解析器类型：keyword（关键词匹配）
time_generator:
  type: "simple_natural"            # 时间生成器类型：simple_natural（随机生成自然口语化时间）


# ============================================
# 9. 追踪与日志
# ============================================
trace_enabled: true                 # 是否生成详细追踪 JSON 文件（用于后续分析）
logging:
  level: "DEBUG"                    # 日志级别：DEBUG | INFO | WARNING | ERROR
  file_prefix: "dialogue_builder"   # 日志文件名前缀
  console: true                     # 是否同时输出到控制台
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"  # 日志格式
  datefmt: "%Y-%m-%d %H:%M:%S"      # 日期格式
  # log_dir: "logs"                 # 默认值：日志文件保存目录


# ============================================
# 10. 自动分析配置（生成对话后自动分析 trace）
# ============================================
auto_analysis:
  enabled: true                     # 是否启用自动分析
  format: "html"                    # 图表格式：html（需要 plotly）或 png（需要 matplotlib）


# ============================================
# 11. 分析器配置（独立运行或自动分析时使用）
# ============================================
analyzer:
  type: "default"                   # 分析器类型（当前仅 default）
  format: "html"                    # 图表格式（与 auto_analysis.format 保持一致）


# ============================================
# 12. 扩展列名（若 Excel 列名与默认不同可修改）
# ============================================
keep_columns:
  - "uid"
  - "parent(继承)"
  - "repeat(次数)"
  - "conditions(条件)"
  - "human(客户)"
  - "assistant(专员)"
  - "flexible_stop(可选不继承)"
  - "是否再见"


# ============================================
# 13. 多进程配置
# ============================================
multiprocessing:
  enabled: false                    # 是否启用多进程并行生成
  # num_processes: 32               # 默认值：进程数（若不设置，默认为 CPU 核心数）


# ============================================
# 附录：配置说明与示例
# ============================================
# 【配置验证规则】
#   1. a_set 和 b_set 的模块必须存在于 modules 列表中
#   2. terminal_modules 的模块必须存在于 modules 列表中
#   3. insert_nodes 的模块必须存在于 a_set 或 b_set 中
#   4. transition_rules 中的模块必须存在于 modules 列表中
#   5. self_loop_modules 的模块必须存在于 modules 列表中
#   6. case_loader 类型与路径配置必须匹配（default 需要 cases_dir，xiaoying 需要 replace_dir 和 system_dir）
#   7. 概率值必须在 0~1 范围内

# 【自动同步机制】
#   modules 和 max_repeat 会从 Excel 模板自动提取并覆盖配置值
#   如需手动控制，确保 Excel 模板中的模块和 repeat(次数) 列与配置一致

# 【路径生成规则】
#   A_set 模块特性：路径中只能出现一个 A_set 模块，从 B_set 跳回已选 A_set 的概率会被增强
#   B_set 模块特性：可以多次出现，候选集包含其他 B_set 模块和已选 A_set 模块
#   终止模块：路径遇到 terminal_modules 中的模块时立即停止

# 【动态概率计算】
#   概率 = start_prob + (end_prob - start_prob) * t^exponent
#   其中 t 为归一化位置（0~1），由 pressure_strategy 决定：
#     - normalized: t = idx / (total-1)（基于路径长度归一化）
#     - absolute: t = min(1.0, idx / max_expected_modules)（基于绝对索引）
#     - sigmoid: t = 1/(1+exp(-slope*(x-0.5)))（Sigmoid 曲线）
#     - linear_decay: t = 1 - idx/(total-1)（线性衰减）

# 【案例加载器类型说明】
#   default：单目录模式，每个 .txt 文件同时作为 prompt 和占位数据来源
#   xiaoying：双目录模式，replace_dir 存放占位数据，system_dir 存放系统提示

# 【输出目录结构】
#   {output_dir}/{task_name}_{num_dialogues}_{seed}/
#   ├── {task_name}_generate_{num_dialogues}_{seed}_{timestamp}.json  # 生成的对话数据
#   ├── intermediate/
#   │   ├── logs/                      # 日志文件
#   │   ├── traces/                    # 追踪数据
#   │   └── analysis/                  # 分析报告
#   └── shard_*.jsonl                  # 多进程模式下的临时分片文件（生成后会被合并删除）
