# ============================================
# 多轮对话生成系统 - 通用配置模板
# 版本：v3.0 (支持配置化跳转规则)
# 说明：所有配置均在此文件中定义，修改后无需更改代码。
#       配置项按功能模块分组，每个配置项均有详细注释。
# ============================================

# ============================================
# 1. 项目基础配置
# ============================================
company: "xiaoying"                  # 公司/业务标识（仅用于日志和命名）
start_module: "身份确认"             # 对话起始模块名（必须存在于 modules 列表中）
task_name: "xiaoying_v2"             # 任务名称（输出子目录为 {task_name}_{num_paths}_{seed}）
output_dir: "output"                 # 根输出目录（所有任务输出到该目录下）
paths_cache_dir: "paths"             # 路径缓存的子目录（相对于 output_dir）
paths_cache: "output/paths/all_paths_{num_paths}_{seed}.json"  # 路径缓存文件模板（保持原有命名以兼容缓存复用）

# ============================================
# 2. 生成规模与随机性
# ============================================
num_paths: 400                     # 要生成的对话数量（兼容旧配置，与 num_dialogues 等效）
# num_dialogues: 40000               # 新命名：要生成的对话数量（优先级高于 num_paths）
# num_paths_to_generate: 1000        # 实际生成的不重复路径数（小于 num_dialogues 时循环复用）
random_seed: 42                      # 全局随机种子（用于可复现性）
checkpoint_interval: 50000           # 断点续传保存间隔（每生成 N 条对话保存一次）

# ============================================
# 3. 数据文件路径
# ============================================
excel_path: "datas/xiaoying_v2/【生成式通用后端】电催话术通用模板-首催20260702.xlsx"   # 话术模板 Excel 文件
prob_path: "datas/xiaoying_v2/prob0702.xlsx"        # 模块转移概率矩阵 Excel 文件

# 案例加载器配置（支持多种类型）
case_loader:
  type: "xiaoying"                   # 加载器类型：default（单目录） 或 xiaoying（双目录）
  # default 模式所需参数（当 type="default" 时启用）
  # cases_dir: "datas/cases"          # 案例文件目录（每个 .txt 同时作为 prompt 和占位数据）
  # xiaoying 模式所需参数（当 type="xiaoying" 时启用）
  replace_dir: "datas/xiaoying_v2/cases_replace"   # 占位数据目录
  system_dir: "datas/xiaoying_v2/cases_system"     # 系统提示目录

# ============================================
# 4. 模块定义与业务规则
# ============================================
# 模块列表：从 Excel 模板自动提取（如需手动指定，取消注释并修改）
# modules:
#   - "身份确认"
#   - "告知"
#   ...

# 每个模块的最大重复次数（从 Excel 模板自动提取，如需手动覆盖，取消注释并修改）
# max_repeat:
#   身份确认: 4
#   告知: 0
#   ...

# A/B 集规则（用于路径生成中的候选集限制）
# A_set：问题原因类模块，路径中只能出现一个 A_set 模块
# B_set：态度回应类模块，可以在路径中多次出现
a_set:
  - "通用原因"
  - "否认办理业务"
  - "工程款"
  - "未发工资"
  - "还错卡"
  - "生病住院"
  - "破产"
  - "失业"
  - "他人用款"
  - "忘记还款"
  - "盗刷"

b_set:
  - "敷衍"
  - "投诉处理"
  - "信息问题"
  - "不方便接电"
  - "对抗"
  - "没钱"
  - "诉求"
  - "承诺还款"
  - "无法沟通"

# 终止模块（路径遇到这些模块时停止继续扩展）
terminal_modules:
  - "已还款"

# 独立循环模块配置（这些模块的路径独立于正常路径，只在自身循环）
# 格式：模块名: 该模块路径在所有路径中的占比概率
self_loop_modules:
  语音留言: 0.01

# 需要附加施压话术的模块（当这些模块出现在路径中时，可能触发施压）
insert_nodes:
  - "失业"
  - "破产"
  - "生病住院"
  - "未发工资"
  - "工程款"
  - "通用原因"
  - "没钱"

# ============================================
# 5. 跳转规则配置（核心配置：替代代码中的硬编码规则）
# ============================================
# transition_rules: 定义模块之间的跳转规则，支持白名单和黑名单两种模式
#
# 配置说明：
#   每个模块可以配置以下属性：
#   模块名:
#     mode: 规则模式
#       - "allow_list": 白名单模式，只允许跳转到 modules 列表中的模块
#       - "deny_list": 黑名单模式，禁止跳转到 modules 列表中的模块（默认）
#     modules: 规则对应的模块列表（根据 mode 不同含义不同）
#        - "模块A"
#        - "模块B"
#     force_stop_on_max_repeat: 是否在达到 max_repeat 次数时强制终止路径（默认 false）
#
#   规则优先级：
#     1. 如果当前模块在 transition_rules 中有配置，按配置规则筛选候选模块
#     2. 如果当前模块在 a_set 中，候选为 [current] + b_set（A集规则）
#     3. 如果当前模块在 b_set 中，候选为 b_set + [selected_a]（B集规则）
#     4. 默认候选为所有模块
#
#   额外规则（自动应用，无需配置）：
#     - A_set 模块不能跳转到其他 A_set 模块（只能有一个 A_set 模块）
#     - 已被 ban 的模块（达到 max_repeat 次数）不会出现在候选中
#     - 终止模块（terminal_modules）如果在概率表中有非零概率，会被加入候选
#
# 示例配置（对应原硬编码逻辑）：
transition_rules:
  # 身份确认：只能跳转到 告知、三方、身份确认（白名单模式），达到最大次数时强制终止
  身份确认:
    mode: "allow_list"              # 白名单模式：只允许跳转到指定模块
    modules:
      - "告知"
      - "三方"
      - "身份确认"
    force_stop_on_max_repeat: true  # 达到 max_repeat 次数时强制停止路径

  # 告知：不能跳转到 身份确认、转告（黑名单模式）
  告知:
    mode: "deny_list"               # 黑名单模式：禁止跳转到指定模块
    modules:
      - "身份确认"
      - "转告"

  # 信息核实：不能跳转到 告知、身份确认、三方、转告（黑名单模式）
  信息核实:
    mode: "deny_list"
    modules:
      - "告知"
      - "身份确认"
      - "三方"
      - "转告"

  # 三方：只能跳转到 三方、转告（白名单模式）
  三方:
    mode: "allow_list"
    modules:
      - "三方"
      - "转告"

# ============================================
# 6. 施压话术配置
# ============================================
# 固定施压概率（仅在 pressure_dynamic_enabled=false 时使用）
pressure_prob: 0.3

# 动态施压概率开关
pressure_dynamic_enabled: true

# ---- 动态概率曲线参数（使用 probability.py 中的计算器） ----
pressure_calc_type: "exponential"   # 曲线类型：exponential（指数）| sigmoid | linear

# 指数曲线参数（pressure_calc_type=exponential 时使用）
pressure_start_prob: 0.7            # 路径开头基础概率
pressure_end_prob: 0.9              # 路径末尾基础概率
pressure_curve_exponent: 4.5        # 指数（越大后期增长越快）

# Sigmoid 曲线参数（pressure_calc_type=sigmoid 时使用）
# pressure_sigmoid_slope: 10.0      # 斜率

# 线性曲线参数（pressure_calc_type=linear 时使用）
# 会复用 pressure_start_prob 和 pressure_end_prob

# ---- 施压次数与位置策略 ----
pressure_max_total: 3               # 每条对话最多施压次数

# 施压位置策略：normalized（基于路径长度归一化）、absolute（基于绝对索引）
pressure_strategy:
  type: "normalized"                # normalized | absolute | sigmoid | linear_decay
  # absolute 策略需要 max_expected_modules
  # max_expected_modules: 15
  # sigmoid 策略需要 slope
  # slope: 30.0

# ---- 模块权重（乘数） ----
module_pressure_weights:            # 仅对 insert_nodes 中的模块生效
  没钱: 1.2
  失业: 1.0
  破产: 1.0
  生病住院: 1.0
  未发工资: 1.0
  工程款: 1.0
  通用原因: 0.9

# ============================================
# 7. 再见终止与继承链配置
# ============================================
# ---- 继承链停止概率 ----
flexible_stop_prob: 0.7            # 后代链遇到 flexible_stop=1 时提前停止的概率

# ---- 再见终止（固定概率，若动态再见未启用则使用此值） ----
goodbye_termination_prob: 0.7

# ---- 动态再见概率配置（与施压类似，独立控制） ----
goodbye_dynamic_enabled: true       # 是否启用动态再见概率
goodbye_calc_type: "exponential"    # 曲线类型：exponential、sigmoid、linear
goodbye_start_prob: 0.5             # 路径开头再见概率
goodbye_end_prob: 0.9               # 路径末尾再见概率
goodbye_exponent: 3.0               # 指数（越大后期增长越快）
# Sigmoid 斜率（如使用 sigmoid）: goodbye_sigmoid_slope: 10.0
goodbye_min_idx: 2                  # 强制忽略前 N 个模块的再见（索引从0开始）

# ============================================
# 8. 解析器配置
# ============================================
condition_parser: "keyword"         # 条件解析器类型：keyword（关键词匹配）或 future 扩展
time_generator:
  type: "simple_natural"            # 时间生成器类型：simple_natural（随机生成自然口语化时间）

# ============================================
# 9. 追踪与日志
# ============================================
trace_enabled: true                 # 是否生成详细追踪 JSON 文件
logging:
  level: "DEBUG"                    # 日志级别（DEBUG, INFO, WARNING, ERROR）
  file_prefix: "dialogue_builder"   # 日志文件名前缀
  console: true                     # 是否同时输出到控制台
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

# ============================================
# 10. 自动分析配置（生成对话后自动分析 trace）
# ============================================
auto_analysis:
  enabled: true                     # 是否启用自动分析
  format: "html"                    # 图表格式：html 或 png

# ============================================
# 11. 分析器配置（独立运行或自动分析时使用）
# ============================================
analyzer:
  type: "default"                   # 分析器类型（当前仅 default）
  format: "html"                    # 图表格式（与 auto_analysis.format 保持一致）

# ============================================
# 12. 扩展列名（若 Excel 列名与默认不同可修改）
# ============================================
keep_columns:
  - "uid"
  - "parent(继承)"
  - "repeat(次数)"
  - "conditions(条件)"
  - "human(客户)"
  - "assistant(专员)"
  - "flexible_stop(可选不继承)"
  - "是否再见"

# ============================================
# 13. 多进程配置
# ============================================
multiprocessing:
  enabled: true                     # 是否启用多进程
  num_processes: 32                 # 进程数（若不设置，默认为 CPU 核心数）