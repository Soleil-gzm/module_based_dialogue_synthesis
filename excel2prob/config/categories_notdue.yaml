# config/categories.yaml

# A 类：自循环模块，路径中只出现一次
A:
  - 失业
  - 破产
  - 生病住院
  - 还错卡
  - 工资未发
  - 工程款
  - 否认办理业务
  - 通用原因
  - 他人用款
  - 忘记还款
  - 盗刷
  - 未发工资

# B 类：可跳转模块
B:
  - 没钱
  - 信息问题
  - 投诉处理
  - 诉求
  - 对抗
  - 不方便接电
  - 敷衍
  - 无法沟通
  - 不方便接电
  


# 自定义模块：覆盖默认出边规则，手动指定候选集
C:
  - 承诺还款
  - 已还款
  
manual:
  # 字典格式：手动指定权重，其余模块为 0
  身份确认:
    # 身份确认: 15
    # 告知: 70
    # 三方: 15
    - 身份确认
    - 告知
    - 三方
    
  告知:
    - 三方
    - 信息核实
    - A
    - B
    - C

  三方:
    - 转告
    - 三方

  信息核实:
    - 信息核实
    - A
    - B
    - C
    
  转告:
    - 转告

  语音留言:
    - 语音留言

  承诺还款:
    - 承诺还款
    - 敷衍
    - 投诉处理
    - 信息问题
    - 无法沟通
    - 对抗
    - 诉求

  已还款:
    - 已还款

# ============================================================
# 业务偏好（全部可选，不写则行为和之前完全一样）
# ============================================================

# 单模块倍数：让某些模块权重更高（或更低）
boost:
  告知: 18.0        # 枢纽，权重×3
  忘记还款: 2
  # 三方: 0.5
  # 信息问题: 3    # 业务上高频
  # 没钱: 2.2
  # 投诉处理: 1.8
  # 诉求: 1.5
  # 承诺还款: 1.5
  # 还错卡: 1.5

  # 转告: 0.6

# 自循环全局倍数：所有模块跳回自己时，权重×这个值
# 单数字（旧形式，仍支持）
# self_loop_boost: 1.5

# 或者：按类别分层
self_loop_boost:
  # A: 1.5
  B: 5.0
  # C: 1.0
  # default: 0.9     # 未分类模块用这个

# 自循环单模块覆盖：终结模块锁死，特殊模块单独指定
self_loop_boost_override:
  # 语音留言: 100
  # 转告: 100
  # 告知: 10
  # 信息问题: 3.0
  # 三方: 2.0
  # 承诺还款: 10